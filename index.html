<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <title>Sketchroom — Draw the plan before you build the product.</title>
    <meta
      name="description"
      content="A live canvas where your team sketches architecture and the AI proposes in dashed lines, until you commit it in ink."
    />
    <meta name="theme-color" content="#FAFAFA" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sketchroom" />
    <meta property="og:title" content="Sketchroom — Draw the plan before you build the product." />
    <meta
      property="og:description"
      content="A live canvas where the AI proposes in dashed lines, until you commit it in ink."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sketchroom — Draw the plan before you build the product." />
    <meta name="twitter:image" content="/og.png" />
    <meta
      name="twitter:description"
      content="A live canvas where the AI proposes in dashed lines, until you commit it in ink."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Sketchroom",
            "description": "A live canvas where teams sketch architecture and an AI copilot proposes in dashed lines until it is committed."
          },
          {
            "@type": "SoftwareApplication",
            "name": "Sketchroom",
            "applicationCategory": "DesignApplication",
            "operatingSystem": "Web",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Geist is self-hosted (@fontsource-variable), so there is no font CDN
         dependency and no cross-origin font request. -->
  </head>
  <body>
    <!-- data-theme on <html> is the pre-hydration default (light). No inline
         script is needed, which keeps the CSP free of script-src 'unsafe-inline';
         ThemeProvider adopts the stored preference on mount. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
